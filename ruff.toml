#
# The Python outside the package -- scripts/, experiments/, ci/ and conformance/ --
# is held to the rules of the package (python/pyproject.toml).
extend = "python/pyproject.toml"
src = ["python/src", "scripts", "experiments", "ci", "conformance"]
# The feature probes are not held to these rules yet.
extend-exclude = ["tools"]

# Command-line programs print, run the tools they are pointed at, and compare with
# the numbers of formats and of the rules of their task.
[lint.extend-per-file-ignores]
"scripts/**" = ["T201", "S603", "S607", "PLR2004"]
"experiments/**" = ["T201", "S603", "S607", "PLR2004"]
"ci/**" = ["T201", "S603", "S607", "PLR2004"]
# The references are drawn with fixed seeds, for tests and not for secrets.
"conformance/**" = ["T201", "S311", "PLR2004"]
