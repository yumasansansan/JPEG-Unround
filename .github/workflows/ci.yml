#
# The probe job measures, on each of the three systems JPEG-Unround supports,
# what the pinned LLVM toolchain and the system's C++ library can do (ci/probe.sh):
# JPEG-Unround uses a C++23/26 or C23 feature only when its probe passes
# everywhere, and macOS has no machine of its own but this one. The reports are
# kept as an artifact and shown in the summary of the run. The build and test
# jobs of the implementations will follow.
#
# The toolchain comes from ci/setup.sh, as in ADLplug-Next. The one action,
# actions/upload-artifact, is pinned to the commit of its release.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  probe:
    name: feature probes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025-vs2026, ubuntu-26.04, macos-26]

    steps:
      - name: Check out
        run: |
          git config --global core.autocrlf false
          git -c init.defaultBranch=main init --quiet
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --quiet --depth 1 origin "$GITHUB_SHA"
          git checkout --quiet --detach "$GITHUB_SHA"
          git log -1 --format='%H %s'

      - name: Set up the toolchain
        run: bash ci/setup.sh

      - name: Probe the toolchain
        run: bash ci/probe.sh probe-reports

      - name: Keep the reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: probe-${{ matrix.os }}
          path: probe-reports/
          if-no-files-found: error
          retention-days: 30
