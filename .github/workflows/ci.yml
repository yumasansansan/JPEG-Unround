#
# The build job builds and tests every preset of CMakePresets.json that a system
# can build, on each of the three systems JPEG-Unround supports (ci/build.sh,
# ci/test.sh): Debug, Release, and the address and undefined sanitizers
# everywhere; the thread sanitizer on Ubuntu, where the C++ tests read files on
# several threads at once; and on Ubuntu the fuzz targets, which are fuzzed for
# a minute on every push (ci/fuzz.sh) and for longer once a day
# (.github/workflows/fuzz.yml). A build also fails when one of its programs asks
# the system for a library other than the C++ library and the C runtime. The
# debug builds also read every parameter list of the project's C and C++ on each
# system, where each one's own #if branches are compiled (ci/void-params.py).
#
# The rust job checks and tests the Rust implementation on each system
# (ci/rust.sh), with the toolchain that rust/rust-toolchain.toml pins; checks
# that its code is vector code of the full width of each build that is shipped
# (ci/vectorization.sh: AVX2 and AVX-512 on x86-64, NEON on AArch64); and on
# x86-64 builds it for AVX-512 (ci/avx512.sh), and tests that build where the
# runner has AVX-512. The python job checks the Python implementation
# (ci/python.sh), in the micromamba environment of environment.yml
# (ci/micromamba.sh), with the shared C layer built by the release preset. The
# lint job reads the C and C++ with clang-tidy (ci/tidy.sh) and for their layout
# (ci/format.sh), and checks the checkers of parameter lists and of vector code
# on cases of their own.
#
# The probe job measures what the pinned LLVM toolchain and the system's C++
# library can do (ci/probe.sh): JPEG-Unround uses a C++23/26 or C23 feature only
# when its probe passes everywhere, and macOS has no machine of its own but this
# one. The reports are kept as an artifact and shown in the summary of the run.
# macOS is probed twice: on macos-26 with the Xcode 26 SDK, for macOS 26.0, and
# on xcode-27 (a public preview of GitHub's, macOS 27 with the Xcode 27 SDK),
# for macOS 26.0 and 27.0. What the newer SDK's headers bring shows for 26.0
# already; what needs macOS 27's own libc++ shows only for 27.0.
#
# The toolchain comes from ci/setup.sh, as in ADLplug-Next. The one action,
# actions/upload-artifact, is pinned to the commit of its release.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.preset }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025-vs2026, ubuntu-26.04, macos-26]
        preset: [debug, release, sanitize]
        include:
          - { os: ubuntu-26.04, preset: tsan }
          - { os: ubuntu-26.04, preset: fuzz }

    steps:
      - name: Check out
        run: |
          # The commit, and the submodules at depth 1. Git keeps the files as
          # committed, CRLF or LF, on every runner.
          git config --global core.autocrlf false
          git -c init.defaultBranch=main init --quiet
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --quiet --depth 1 origin "$GITHUB_SHA"
          git checkout --quiet --detach "$GITHUB_SHA"
          git submodule update --init --depth 1 --jobs 4
          git log -1 --format='%H %s'
          git submodule status

      - name: Set up the toolchain
        run: bash ci/setup.sh

      - name: Build
        run: bash ci/build.sh "${{ matrix.preset }}"

      - name: Test
        run: bash ci/test.sh "${{ matrix.preset }}"

      - name: Read the parameter lists
        if: ${{ matrix.preset == 'debug' }}
        run: |
          # Windows calls it python; there, python3 may be the Store's stub.
          python=python3
          if [ "$RUNNER_OS" = Windows ]; then python=python; fi
          "$python" ci/void-params.py --build build/debug

      - name: Fuzz for a minute
        if: ${{ matrix.preset == 'fuzz' }}
        run: bash ci/fuzz.sh 60 fuzz-run/corpus fuzz-run/crashes

      - name: Keep the inputs that failed
        if: ${{ failure() && matrix.preset == 'fuzz' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashes-${{ github.run_id }}
          path: fuzz-run/crashes/
          if-no-files-found: ignore
          retention-days: 30

  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025-vs2026, ubuntu-26.04, macos-26]

    steps:
      - name: Check out
        run: |
          git config --global core.autocrlf false
          git -c init.defaultBranch=main init --quiet
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --quiet --depth 1 origin "$GITHUB_SHA"
          git checkout --quiet --detach "$GITHUB_SHA"
          git submodule update --init --depth 1 --jobs 4
          git log -1 --format='%H %s'

      - name: Set up the toolchain
        run: bash ci/setup.sh

      - name: Check and test
        run: bash ci/rust.sh

      - name: Check the vector code
        run: bash ci/vectorization.sh

      - name: Build for AVX-512, and test where the runner has it
        if: ${{ runner.arch == 'X64' }}
        run: bash ci/avx512.sh test

  python:
    name: python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025-vs2026, ubuntu-26.04, macos-26]

    steps:
      - name: Check out
        run: |
          git config --global core.autocrlf false
          git -c init.defaultBranch=main init --quiet
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --quiet --depth 1 origin "$GITHUB_SHA"
          git checkout --quiet --detach "$GITHUB_SHA"
          git submodule update --init --depth 1 --jobs 4
          git log -1 --format='%H %s'

      - name: Set up the toolchain
        run: bash ci/setup.sh

      - name: Set up micromamba and the environment
        run: bash ci/micromamba.sh

      - name: Check and test
        run: bash ci/python.sh release

  lint:
    name: lint (ubuntu-26.04)
    runs-on: ubuntu-26.04
    timeout-minutes: 60

    steps:
      - name: Check out
        run: |
          git config --global core.autocrlf false
          git -c init.defaultBranch=main init --quiet
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --quiet --depth 1 origin "$GITHUB_SHA"
          git checkout --quiet --detach "$GITHUB_SHA"
          git submodule update --init --depth 1 --jobs 4
          git log -1 --format='%H %s'

      - name: Set up the toolchain
        run: bash ci/setup.sh

      - name: Lay out the C and C++
        run: bash ci/format.sh

      - name: Read the C and C++ with clang-tidy
        run: bash ci/tidy.sh debug

      - name: Check the checker of parameter lists
        run: python3 ci/void-params.py --self-test

      - name: Check the checker of vector code
        run: python3 ci/vectorization.py self-test

  probe:
    name: feature probes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025-vs2026, macos_targets: "" }
          - { os: ubuntu-26.04, macos_targets: "" }
          - { os: macos-26, macos_targets: "26.0" }
          - { os: xcode-27, macos_targets: "26.0 27.0" }

    steps:
      - name: Check out
        run: |
          git config --global core.autocrlf false
          git -c init.defaultBranch=main init --quiet
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --quiet --depth 1 origin "$GITHUB_SHA"
          git checkout --quiet --detach "$GITHUB_SHA"
          git log -1 --format='%H %s'

      - name: Set up the toolchain
        run: bash ci/setup.sh

      - name: Probe the toolchain
        env:
          UNROUND_MACOS_TARGETS: ${{ matrix.macos_targets }}
        run: bash ci/probe.sh probe-reports

      - name: Keep the reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: probe-${{ matrix.os }}
          path: probe-reports/
          if-no-files-found: error
          retention-days: 30
