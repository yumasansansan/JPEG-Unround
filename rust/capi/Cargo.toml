[package]
name = "unround-capi"
description = "The C interface of JPEG-Unround, which the Python package calls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# unround_capi.dll, libunround_capi.so or libunround_capi.dylib, and an rlib for the tests.
name = "unround_capi"
crate-type = ["cdylib", "rlib"]

[dependencies]
jpeg-unround = { path = "../unround" }
jpegio-sys = { path = "../jpegio-sys" }

[lints]
workspace = true
