#
# The Python environment of JPEG-Unround, for micromamba (conda-forge):
#
#   micromamba create -f environment.yml
#
# Every package is pinned to the version conda-forge resolves to on Windows
# (win-64), Linux (linux-64) and macOS (osx-arm64) alike, so that the three
# systems test the same thing. jpeglib is on PyPI alone; the tests use it as a
# reader of JPEG files independent of this project's own, and everything it
# depends on comes from conda-forge above.
name: jpeg-unround
channels:
  - conda-forge
dependencies:
  - python=3.14.7
  - numpy=2.5.3
  - scipy=1.18.1
  - scikit-image=0.26.0
  - pillow=12.3.0
  - matplotlib-base=3.11.2
  - pytest=9.1.1
  - hypothesis=6.168.0
  - ruff=0.16.8
  - mypy=2.3.1
  - setuptools=84.0.0
  - pip=26.2.1
  - wheel=0.48.0  # which jpeglib asks for
  - pip:
      - jpeglib==1.0.2
